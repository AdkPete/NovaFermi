params:

  # Source Specific Parameters:

  ra: X # Source RA (in degrees)
  dec: X # Source Dec (in degrees)
  name: X # Source Name (must match xml input file!)
  peak: 'year-month-day hour:minute:second' # Peak date and time (UTC)
  data_path: weekly # Path to data files for this source
  figdir: Figures/ # Directory to save figures to
  logdir: "Logs/" # Directory to save log files to.
  result_log: "likelihood_results.csv" # File in which we save all results
  input_model: None
  earliest_time: -140 ##For use in pruning analysis
  latest_time: 0
  monitoring: True ## Set true for monitoring new novae. Changes default grid.
  
  # General Analysis Parameters:

  emin: 100 # Minimum Energy (MeV)
  emax: 300000 # Maximum Energy (MeV)
  pix_sc: 0.2 # Pixel size for spatial binning (degrees)
  N_ebin: 37 # Number of energy bins. Should be >= 10 per decade (or >= 8?)
  roi: 10 # Radius of region of interest in degrees

  
  ## Performance Details
  nproc: 12 # Number of processes to use (for supported functions).

  # What analysis should we run?
  use_pruner: True
  gen_av: True # Generate average likelihood fit
  gen_ts: False # Generate TS maps
  gen_lc: False # Build a light curve
  gen_grid: True # Build Duration / TS Search Grid
  gen_bck: False ## Generate background sample to validate TS Distribution

  # Average model fit parameters. Only runs if gen_av is True
  # Note that all times are in days relative to the peak defined above

  avstart: -1 # Start time for average flux calculation
  avend: 11 # End time for average flux calculation
  up_lim_av: False # Compute upper lim if TS is low
  av_ts_lim: 25 # TS limit for upper limit calculation
  av_outdir: avg_results/ # Location to save data.

  # TS Map Parameters:

  TSPix: 25 # Number of pixels per axis (total = TSPix^2).
  TSscale: 0.25 # Pixel size (degrees)

  # Light Curve Parameters

  window: 5 # Total window width for each bin
  lcstep: 5 # Time (days) between light curve points
  cleanlc: True # Automatically delete intermediate files
  up_lim_lc: True # Flag to compute upper limits in light curve
  ts_lim: 4 # TS value below which we compute upper limits
  lc_start: -10 # Start time for light curve.
  lc_end: 25 # End time for light curve.
  lc_outdir: lc_results/ # Location to save data.

  # False Positive Search
  bck_start: -3650
  bck_end: -150
  bck_outdir: bck_results/

  # TS Grid Parameters

  min_start: -15 # First start time to consider
  max_start: 150 # Last start time to consider
  gridstep: 1 # Step size for grid. Same size is used for start and end times
  min_end: -15 # First end time to consider
  max_end: 150 # Last end time to consider
  grid_outdir: grid_results/ # Location to save grid results
  grid_upper_lims: False

  # Debugging Parameters

  runlog: No # Saves a log file for each analysis keeping track of progress; useful for debugging
  clobber: No # If Yes, will overwrite existing files. Generally recommended to leave as No.

  # Calibration Directory containing calibration files.

  cal_dir: /Users/Peter/Documents/Research/Novae/Fermi/Diffuse/
  template_path: /Users/Peter/Documents/Research/Novae/Fermi/Diffuse/Templates/